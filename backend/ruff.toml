target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends()/Query() defaults are the documented idiom
    "RUF012",  # ClassVar annotations add noise to plain data holders
]

[lint.per-file-ignores]
# Tests intentionally import fixtures and assert on private helpers.
"tests/*" = ["SLF001"]
