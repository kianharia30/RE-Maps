name: CI

# Lint, type-check and test on every push and pull request.
#
# The test suite is integration-heavy by design: the guarantees that matter
# most here ("an unsupported location must never return a price") can only be
# checked against a real database with real constraints, so CI provisions
# PostgreSQL with PostGIS and runs the migrations rather than mocking them.
#
# Tests that need ingested data are marked `db` and skipped when the database
# is empty, so this pipeline stays fast and does not download tens of
# gigabytes of source data on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remaps
        ports: ['5432:5432']
        # Without a health check the job races the container and fails
        # intermittently on a cold runner.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remaps

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: python migrate.py

      - name: Lint
        working-directory: backend
        run: ruff check app ingest ml tests migrate.py cloud_sync.py

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build
